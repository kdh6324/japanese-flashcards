<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ed">
  <meta name="description" content="인터넷 없이 언제든 일본어 단어를 외우는 카드 암기장">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>ことば 카드</title>
  <style>
    :root{--paper:#f6f3ed;--ink:#24251f;--muted:#89877f;--line:#e8e3d9;--green:#496b58;--orange:#ef805d;--card:#fffefa;--shadow:0 16px 44px #453c2912}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans KR",sans-serif;min-height:100svh}
    button{font:inherit;color:inherit} .app{width:min(100%,520px);margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 20px);min-height:100svh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.04em;font-size:19px}.mark{width:32px;height:32px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font-size:17px}.header-actions{display:flex;gap:8px}.icon-btn{height:38px;width:38px;border:1px solid var(--line);border-radius:50%;background:transparent;display:grid;place-items:center;font-size:17px;cursor:pointer}
    .intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}.title{font-size:22px;font-weight:760;letter-spacing:-.05em;margin-top:5px}.counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.counter strong{font-size:16px;color:var(--ink)}
    .progress{height:4px;background:#e9e5dc;border-radius:9px;overflow:hidden;margin-bottom:19px}.progress span{display:block;height:100%;width:0;background:var(--green);border-radius:9px;transition:width .35s}
    .stack{display:flex;flex-direction:column;gap:12px;touch-action:none;overscroll-behavior:contain}.card{background:var(--card);border:1px solid #eee9df;border-radius:23px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .24s,opacity .24s}.answer{height:132px;display:flex;align-items:center;padding:22px 25px;background:#f0f2ec;border-color:#e7ebe2;box-shadow:none}.answer .label,.word .label{position:absolute;left:24px;top:19px;font-size:10px;letter-spacing:.12em;font-weight:750;color:var(--muted)}.answer-content{font-size:22px;letter-spacing:-.04em;font-weight:700;color:var(--green);margin-top:12px}.answer-empty{font-size:14px;color:#a5a297;font-weight:500}.word{height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:contain}.word .label{left:24px;top:20px}.jp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:72px;line-height:1.1;letter-spacing:.03em}.reading{margin-top:10px;font-size:16px;color:var(--muted);letter-spacing:.1em}.hint{position:absolute;bottom:23px;font-size:12px;color:#a39f95}.word.dragging{transition:none}.word.fly{transform:translateY(-125%) rotate(-5deg);opacity:0}
    .actions{display:grid;grid-template-columns:.8fr 1fr 1fr;gap:8px;margin-top:16px}.action{border:1px solid var(--line);background:transparent;border-radius:15px;padding:13px 8px;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}.action.primary{background:var(--green);border-color:var(--green);color:white}.action:active,.icon-btn:active{transform:scale(.98)}.action:disabled{opacity:.35;cursor:default}
    .foot{margin-top:auto;padding-top:22px;text-align:center;color:#a5a196;font-size:11px;line-height:1.6}.foot b{color:#807e74;font-weight:600}
    .overlay{position:fixed;inset:0;background:#24251f66;display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:5}.overlay.open{display:flex}.sheet{background:var(--paper);width:min(100%,500px);border-radius:25px;padding:24px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 20px 80px #0003}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sheet h2{font-size:20px;letter-spacing:-.04em;margin:0}.close{border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}.sheet p{font-size:13px;color:var(--muted);line-height:1.6;margin:8px 0 14px}.sheet textarea{width:100%;height:190px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:#fffefa;padding:14px;font:14px/1.8 inherit;outline-color:var(--green)}.sheet .action{width:100%;margin-top:12px}.sheet .small{font-size:11px}
    .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 78px);left:50%;transform:translate(-50%,12px);background:#292b26;color:#fff;padding:11px 16px;border-radius:30px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-height:700px){.app{padding-top:calc(env(safe-area-inset-top) + 14px)}header{margin-bottom:18px}.word{height:240px}.answer{height:112px}.foot{padding-top:14px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><span class="mark">こ</span>ことば 카드</div><div class="header-actions"><button class="icon-btn" id="shuffle" aria-label="섞기" title="단어 섞기">⤨</button><button class="icon-btn" id="deck" aria-label="단어장 편집" title="단어장 편집">＋</button></div></header>
  <section class="intro"><div><div class="eyebrow">JAPANESE · KOREAN</div><div class="title">오늘의 단어</div></div><div class="counter"><strong id="count">1</strong> / <span id="total">30</span></div></section>
  <div class="progress"><span id="progress"></span></div>
  <section class="stack" aria-label="단어 카드">
    <div class="card answer" aria-live="polite"><span class="label">뜻</span><div class="answer-content" id="answer"><span class="answer-empty">카드를 넘기면 뜻이 여기에 보여요</span></div></div>
    <div class="card word" id="wordCard" role="button" tabindex="0" aria-label="위로 밀어 다음 카드, 아래로 밀어 이전 카드"><span class="label">WORD</span><div class="jp" id="jp"></div><div class="reading" id="reading"></div><div class="hint">↑ 다음 카드　　↓ 이전 카드</div></div>
  </section>
  <div class="actions"><button class="action" id="previous">← 이전</button><button class="action" id="showAnswer">뜻 보기</button><button class="action primary" id="next">다음　↑</button></div>
  <footer class="foot">단어장은 이 기기에 저장돼요.<br><b>비행기 모드에서도 계속 외울 수 있어요.</b></footer>
</main>
<div class="overlay" id="overlay"><section class="sheet"><div class="sheet-head"><h2>내 단어장</h2><button class="close" id="close" aria-label="닫기">×</button></div><p>한 줄에 한 단어씩 적어주세요.<br><b>일본어, 읽는 법, 한국어 뜻</b> 순서로 쉼표로 구분해요.</p><textarea id="words" spellcheck="false" placeholder="猫, ねこ, 고양이&#10;学校, がっこう, 학교"></textarea><p class="small">저장하면 현재 단어장을 바꿉니다. 직접 입력한 단어는 이 기기에 보관됩니다.</p><button class="action primary" id="save">단어장 저장</button><button class="action" id="restore">기본 단어장으로 돌아가기</button></section></div>
<div class="toast" id="toast"></div>
<script>
const defaults=[
['猫','ねこ','고양이'],['犬','いぬ','개'],['水','みず','물'],['本','ほん','책'],['友達','ともだち','친구'],['食べる','たべる','먹다'],['飲む','のむ','마시다'],['美しい','うつくしい','아름답다'],['今日','きょう','오늘'],['明日','あした','내일'],['学校','がっこう','학교'],['先生','せんせい','선생님'],['電車','でんしゃ','전철'],['駅','えき','역'],['時間','じかん','시간'],['家族','かぞく','가족'],['仕事','しごと','일, 업무'],['旅行','りょこう','여행'],['映画','えいが','영화'],['音楽','おんがく','음악'],['写真','しゃしん','사진'],['天気','てんき','날씨'],['好き','すき','좋아함, 좋아하다'],['大切','たいせつ','소중함, 중요함'],['早い','はやい','빠르다, 이르다'],['新しい','あたらしい','새롭다'],['楽しい','たのしい','즐겁다'],['勉強','べんきょう','공부'],['日本語','にほんご','일본어'],['頑張る','がんばる','힘내다, 열심히 하다']];
const $=id=>document.getElementById(id);let deck,order=[],index=0,last=null,toastTimer;
try{deck=JSON.parse(localStorage.getItem('kotoba.deck'))||defaults}catch{deck=defaults}
function start(shuffle=false){order=deck.map((_,i)=>i);if(shuffle)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=0;last=null;render()}
function render(){if(!deck.length){$('jp').textContent='単語';$('reading').textContent='단어를 추가해 주세요';$('answer').innerHTML='<span class="answer-empty">단어장이 비어 있어요</span>';$('count').textContent='0';$('total').textContent='0';$('progress').style.width='0%';$('previous').disabled=true;return}const item=deck[order[index]];last=index>0?deck[order[index-1]]:null;$('jp').textContent=item[0];$('reading').textContent=item[1];$('answer').innerHTML=last?escapeHtml(last[2]):'<span class="answer-empty">카드를 넘기면 뜻이 여기에 보여요</span>';$('count').textContent=index+1;$('total').textContent=order.length;$('progress').style.width=`${index/order.length*100}%`;$('previous').disabled=index===0}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function next(){if(!deck.length)return;if(index>=order.length-1){toast('마지막 카드예요');return}const card=$('wordCard');card.classList.add('fly');setTimeout(()=>{index++;card.classList.remove('fly');render()},210)}
function previous(){if(index<=0)return;index--;render()}
function show(){if(!deck.length)return;$('answer').textContent=deck[order[index]][2]}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('next').onclick=next;$('previous').onclick=previous;$('showAnswer').onclick=show;$('shuffle').onclick=()=>{start(true);toast('단어 순서를 섞었어요')};$('deck').onclick=()=>{$('words').value=deck.map(x=>x.join(', ')).join('\n');$('overlay').classList.add('open')};$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};
$('save').onclick=()=>{const rows=$('words').value.split(/\n/).map(x=>x.trim()).filter(Boolean);const parsed=rows.map(x=>x.split(',').map(y=>y.trim())).filter(x=>x.length>=3&&x[0]&&x[1]&&x[2]);if(!parsed.length){toast('단어를 확인해 주세요');return}deck=parsed;localStorage.setItem('kotoba.deck',JSON.stringify(deck));start();$('overlay').classList.remove('open');toast(`${deck.length}개 단어를 저장했어요`)};$('restore').onclick=()=>{deck=defaults;localStorage.removeItem('kotoba.deck');start();$('overlay').classList.remove('open');toast('기본 단어장으로 돌아왔어요')};
let startY=0,deltaY=0;const wc=$('wordCard');wc.addEventListener('touchstart',e=>{startY=e.touches[0].clientY;deltaY=0;wc.classList.add('dragging')},{passive:false});wc.addEventListener('touchmove',e=>{e.preventDefault();deltaY=e.touches[0].clientY-startY;wc.style.transform=`translateY(${Math.max(-100,Math.min(100,deltaY))}px)`},{passive:false});wc.addEventListener('touchend',e=>{e.preventDefault();wc.classList.remove('dragging');wc.style.transform='';if(deltaY < -55)next();else if(deltaY > 55)previous()},{passive:false});wc.addEventListener('touchcancel',()=>{wc.classList.remove('dragging');wc.style.transform='';deltaY=0});wc.addEventListener('click',e=>{if(e.detail===0)next()});wc.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();next()}else if(e.key==='ArrowDown'){e.preventDefault();previous()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}});
start();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
